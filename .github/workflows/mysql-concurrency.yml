name: MySQL booking concurrency integration

on:
  pull_request:
    paths:
      - 'tests/mysql_concurrency.php'
      - '.github/workflows/mysql-concurrency.yml'
      - 'public/api.php'
      - 'src/booking.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-concurrency:
    name: Two simultaneous reservations for one time slot
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eventosrp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: eventosrp_test
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP 8.2 with MySQL and process control
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pcntl
          coverage: none
      - name: Lint integration test
        run: php -l tests/mysql_concurrency.php
      - name: Run concurrent reservation integration test
        run: php tests/mysql_concurrency.php
